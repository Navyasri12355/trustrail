name: TrustRail CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run linter (ruff)
      run: |
        ruff check .
    
    - name: Check code formatting (black)
      run: |
        black --check .
    
    - name: Type check (mypy)
      run: |
        mypy . --ignore-missing-imports --no-error-summary || true
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short || true
      env:
        DATABASE_URL: sqlite:///./test.db
        ED25519_PRIVATE_KEY_HEX: test_private_key_32_bytes_hex_here
        ED25519_PUBLIC_KEY_HEX: test_public_key_32_bytes_hex_here
        JWT_SECRET_KEY: test_secret_key_for_ci
        DASHBOARD_ADMIN_USERNAME: admin
        DASHBOARD_ADMIN_PASSWORD: admin123
    
    - name: Run adversarial test harness
      run: |
        python -c "
        import sys
        sys.path.insert(0, '..')
        from agent.harness import run_all
        results = run_all()
        sys.exit(0 if all(r.passed for r in results) else 1)
        "
      env:
        DATABASE_URL: sqlite:///./test.db
        RAZORPAY_KEY_ID: rzp_test_ci_key
        RAZORPAY_KEY_SECRET: rzp_test_ci_secret
        ED25519_PRIVATE_KEY_HEX: test_private_key_32_bytes_hex_here
        ED25519_PUBLIC_KEY_HEX: test_public_key_32_bytes_hex_here
        JWT_SECRET_KEY: test_secret_key_for_ci
        DASHBOARD_ADMIN_USERNAME: admin
        DASHBOARD_ADMIN_PASSWORD: admin123
        HARNESS_MERCHANT_ID: mrc_demo_001
